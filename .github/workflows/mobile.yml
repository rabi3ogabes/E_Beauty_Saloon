name: Mobile

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      tenant:
        description: 'White-label tenant slug (mobile/white_label/<tenant>.json)'
        required: true
        default: 'lumiere'
      app:
        description: 'Which app to build'
        type: choice
        options: [client, staff, owner]
        default: client
      mock_pending_apis:
        description: 'Use mock data for endpoints the backend has not shipped yet'
        type: boolean
        default: true

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (also generates l10n)
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/app lib/config lib/core lib/data lib/features lib/router lib/l10n/l10n.dart lib/main_client.dart lib/main_staff.dart lib/main_owner.dart test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: White-label tool dry run
        run: dart run tool/white_label.dart --tenant lumiere --dry-run > /dev/null

  build-android:
    name: Build APK (${{ inputs.tenant || 'lumiere' }} / ${{ inputs.app || 'client' }})
    needs: analyze-test
    # Manual builds, and every push to main for the demo tenant.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT: ${{ inputs.tenant || 'lumiere' }}
      APP: ${{ inputs.app || 'client' }}
      MOCK_PENDING_APIS: ${{ inputs.mock_pending_apis == false && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate tenant
        run: |
          if [ ! -f "white_label/${TENANT}.json" ]; then
            echo "::error::mobile/white_label/${TENANT}.json not found"; exit 1
          fi

      - name: Apply white-label config
        run: dart run tool/white_label.dart --tenant "$TENANT" --app "$APP"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons & splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
            {
              echo "storeFile=upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "::notice::No signing secrets; building a debug-signed release APK."
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --flavor "$APP" -t "lib/main_${APP}.dart" \
            --dart-define=MOCK_PENDING_APIS="$MOCK_PENDING_APIS" \
            --build-number "${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TENANT }}-${{ env.APP }}-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-${{ env.APP }}-release.apk
          if-no-files-found: error
          retention-days: 14
