name: luxe_salon
description: Luxe Salon OS mobile apps (white-label client, staff and owner) from one codebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.7.0
  flutter_secure_storage: ^11.2.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.7
  image_picker: ^1.1.2
  camera: ^0.12.2
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  add_2_calendar: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
