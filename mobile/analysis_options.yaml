include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "lib/l10n/generated/**"
    - "build/**"
    - android/**
    - ios/**
  errors:
    todo: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    prefer_single_quotes: true
    avoid_print: false

formatter:
  page_width: 140
  trailing_commas: preserve
