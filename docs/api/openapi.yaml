  /api/v1/availability:
    get:
      summary: 'Available times for one day.'
      operationId: availableTimesForOneDay
      description: "Slots are grouped by part of day in the branch timezone; `starts_at` is UTC and must be posted back unchanged.\nWhen the day is empty `next_available_date` points to the next date with a free slot."
      parameters:
        -
          in: query
          name: branch_id
          description: Branch.
          example: 1
          required: true
          schema:
            type: integer
            description: Branch.
            example: 1
        -
          in: query
          name: services
          description: 'Service ids, booked back-to-back in this order.'
          example:
            - 3
          required: true
          schema:
