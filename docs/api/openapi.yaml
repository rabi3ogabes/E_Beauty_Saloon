            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: ''
                  example: '+97455551234'
                code:
                  type: string
                  description: ''
                  example: '123456'
                name:
                  type: string
                  description: 'Name for a first sign-in.'
                  example: Reem
                  nullable: true
                device_name:
                  type: string
                  description: ''
                  example: "Reem's iPhone"
              required:
