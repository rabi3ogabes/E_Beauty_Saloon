openapi: 3.0.3
info:
  title: 'Luxe Salon OS API'
  description: 'REST API for salon client, staff and owner apps. Identify the salon with the X-Tenant header (salon slug) or call the salon domain. Authenticate clients with phone OTP to receive a Bearer token.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'AI Studio'
    description: "\nVirtual try-on for the client app. Same safety gates as the website (consent, minors, moderation, client quota,\nsalon credit wallet) because every job goes through RequestTryOn. Photos are encrypted at rest and only served\nthrough short-lived signed URLs on the salon's own domain."
  -
    name: Authentication
    description: "\nClients sign in with a one-time code sent by WhatsApp/SMS and receive a Sanctum token.\nSend `X-Tenant: {salon-slug}` (or call the salon's own domain)."
  -
    name: Booking
    description: "\nAvailability, booking, payment hand-off, cancel and reschedule for the client app. Every write goes through\nthe same Booking Actions as the salon website (HoldSlot → CreateBooking → StartBookingPayment), so the same\ndomain events fire and the same rules apply."
  -
    name: 'Owner app'
    description: "\nToday's KPIs per branch, alerts and quick campaigns. Branch restrictions of the member apply; KPIs need\nreports.view (revenue figures reports.revenue), campaigns marketing.send."
  -
    name: 'Packages, notifications & referrals'
    description: "\nSession packages / bundles (Marketing module), push device registration, the client's campaign inbox and\nreferral share info."
  -
    name: 'Profile, wallet & loyalty'
    description: ''
  -
    name: 'Salon catalog'
    description: "\nPublic, cacheable salon information (ETag supported)."
  -
    name: Shop
    description: "\nMobile app shop API (/api/v1/shop/...). Cart is identified by the X-Cart-Token header\n(returned by every cart response); client endpoints use Sanctum tokens. Orders are placed with the same\nPlaceOrder action as the website checkout."
  -
    name: 'Staff & owner authentication'
    description: "\nTeam members sign in with their dashboard e-mail and password. When app MFA (authenticator) is enabled on the\naccount, the first attempt answers 422 with `error.code = mfa_required`; repeat with `code`. Tokens carry the\nability of the app (`staff` or `owner`) and only work on that app's endpoints, for this salon."
  -
    name: 'Staff app'
    description: "\nThe signed-in stylist's day, check-in, commissions, time off and client cards. Branch restrictions of the\nteam member apply (same as the dashboard); bookings are shown in each branch's timezone."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Clients: <code>POST /api/v1/auth/otp</code> then <code>/auth/verify</code> (phone OTP). Staff / owner apps: <code>POST /api/v1/staff/auth/login</code> or <code>/owner/auth/login</code> (e-mail + password, plus the authenticator code when MFA is on). Send <code>Authorization: Bearer {token}</code> and <code>X-Tenant: {salon-slug}</code>. Errors, money, idempotency and ETag conventions: <code>docs/api/README.md</code>.'
security:
  -
    default: []
