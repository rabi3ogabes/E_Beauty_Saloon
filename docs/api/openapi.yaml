  '/api/v1/studio/looks/{reference}/media/{which}':
    get:
      summary: 'Look photo (signed URL from the job / look payload).'
      operationId: lookPhotosignedURLFromTheJobLookPayload
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: lumiere
          schema:
            type: string
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses:
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You do not have access to this.'
                  error:
                    code: forbidden
                    status: 403
                properties:
                  message:
                    type: string
                    example: 'You do not have access to this.'
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: forbidden
                      status:
                        type: integer
                        example: 403
      tags:
        - 'AI Studio'
      security: []
    parameters:
      -
        in: path
        name: reference
        description: ''
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: which
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/studio/consent:
    post:
      summary: 'Give AI photo consent.'
      operationId: giveAIPhotoConsent
      description: 'Required once (per consent version) before the first try-on; `adult=false` blocks face styles.'
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: lumiere
          schema:
            type: string
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses: {  }
      tags:
        - 'AI Studio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accept:
                  type: boolean
                  description: 'Must be true.'
                  example: true
                adult:
                  type: boolean
                  description: 'The client confirms they are 18 or older.'
                  example: true
              required:
                - accept
                - adult
    delete:
      summary: 'Withdraw AI photo consent.'
      operationId: withdrawAIPhotoConsent
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: lumiere
          schema:
            type: string
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses: {  }
      tags:
        - 'AI Studio'
  /api/v1/studio/jobs:
    post:
      summary: 'Start a try-on.'
      operationId: startATryOn
      description: "Multipart upload. Poll GET /studio/jobs/{id} until `status` is succeeded or failed. Credits are charged\nonly when the look succeeds. `consent`/`adult` may be sent here instead of calling POST /studio/consent."
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          example: lumiere
          schema:
            type: string
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses: {  }
      tags:
        - 'AI Studio'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  description: 'JPEG/PNG/WebP selfie.'
                style_id:
                  type: integer
                  description: ''
                  example: 4
                category:
                  type: string
                  description: "Must match the style's category."
                  example: hair
                  nullable: true
                consent:
                  type: boolean
                  description: 'Records consent first when true.'
                  example: true
                  nullable: true
                adult:
                  type: boolean
                  description: 'Age confirmation for the inline consent.'
                  example: true
                  nullable: true
              required:
                - photo
                - style_id
