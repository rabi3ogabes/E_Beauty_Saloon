    post:
      summary: 'Place an order.'
      operationId: placeAnOrder
      description: "Uses the X-Cart-Token cart, or builds one from `items` (the app keeps its cart locally). With\n`payment_method=online` the response carries `checkout_url` (hosted payment page). Send an Idempotency-Key."
      parameters:
        -
          in: header
          name: Idempotency-Key
          description: ''
          example: 0b6f6a52-0f87-4d64-8f5e-2b8c9a0d1e11
          schema:
            type: string
        -
          in: header
          name: X-Tenant
          description: ''
          example: lumiere
          schema:
            type: string
        -
          in: header
          name: Accept-Language
          description: ''
          example: en
          schema:
            type: string
      responses: {  }
      tags:
        - Shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  description: '`[{variant_id, qty}]` (omit to use the X-Cart-Token cart).'
                  example:
                    - []
                  items:
                    type: object
                    nullable: true
                    properties:
                      variant_id:
                        type: integer
                        description: 'This field is required when <code>items</code> is present.'
                        example: 16
                      qty:
                        type: integer
                        description: 'Must be at least 1. Must not be greater than 20.'
                        example: 12
                        nullable: true
                fulfilment:
                  type: string
                  description: delivery|pickup|same_day.
                  example: pickup
                branch_id:
                  type: integer
                  description: 'Pickup branch.'
                  example: 1
                  nullable: true
                address_id:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
                zone_id:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
                area:
                  type: string
                  description: 'Delivery area.'
                  example: 'West Bay'
                  nullable: true
                street:
                  type: string
                  description: 'Must not be greater than 160 characters.'
                  example: g
                  nullable: true
                building:
                  type: string
                  description: 'Must not be greater than 60 characters.'
                  example: z
                  nullable: true
                unit:
                  type: string
                  description: 'Must not be greater than 40 characters.'
                  example: m
                  nullable: true
                address:
                  type: string
                  description: 'Must not be greater than 160 characters.'
                  example: i
                  nullable: true
                lat:
                  type: number
                  description: 'Must be between -90 and 90.'
                  example: -90
                  nullable: true
                lng:
                  type: number
                  description: 'Must be between -180 and 180.'
                  example: -179
                  nullable: true
                address_notes:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: d
                  nullable: true
                save_address:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                delivery_slot:
                  type: string
                  description: 'Must not be greater than 40 characters.'
                  example: l
                  nullable: true
                customer_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: j
                  nullable: true
                customer_email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 150 characters.'
                  example: lafayette.considine@example.com
                  nullable: true
                payment_method:
                  type: string
                  description: 'online|cod|wallet|gift_card (default cod).'
                  example: online
                  nullable: true
                cod_method:
                  type: string
                  description: ''
                  example: cash
                  enum:
                    - cash
                    - card_terminal
                  nullable: true
                use_wallet:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                gift_card_code:
                  type: string
                  description: 'Must not be greater than 24 characters.'
                  example: aykcmyuwpwlvqwrs
                  nullable: true
                coupon_code:
                  type: string
                  description: 'Must not be greater than 40 characters.'
                  example: i
                  nullable: true
                gift_message:
                  type: string
                  description: 'Must not be greater than 300 characters.'
                  example: t
                  nullable: true
                notes:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: c
                  nullable: true
              required:
                - fulfilment
